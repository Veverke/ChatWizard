name: CI

on:
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode-version: [stable, insiders]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      # Ensures both the native-module rebuild and the vscode-test runner use
      # the same VS Code version (stable or insiders) so the Electron ABI
      # of better-sqlite3 matches the runtime that executes the tests.
      VSCODE_VERSION: ${{ matrix.vscode-version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile & lint
        run: npm run compile && npm run lint

      - name: TypeScript strict typecheck
        run: npx tsc --noEmit && npx tsc --noEmit -p tsconfig.scripts.json

      # Download VS Code first so rebuild-native.js can read the exact Electron
      # version from .vscode-test/ before recompiling better-sqlite3.
      # Without this step the native binary is compiled against system Node.js ABI
      # and fails to load inside VS Code's Electron runtime.
      - name: Download VS Code
        run: node -e "require('@vscode/test-electron').downloadAndUnzipVSCode('${{ matrix.vscode-version }}')"

      - name: Rebuild native modules for VS Code's Electron
        run: npm run rebuild:native

      - name: Run tests with coverage
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a npm run test:coverage
          else
            npm run test:coverage
          fi

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.vscode-version == 'stable'
        uses: codecov/codecov-action@vv5.4.3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true

      - name: Smoke tests (MCP)
        shell: bash
        run: npx tsx scripts/smoke-test-mcp-server.ts && npx tsx scripts/smoke-test-phase4.ts

      - name: Build extension bundle
        run: npm run bundle

      - name: Run integration tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a npm run test:integration
          else
            npm run test:integration
          fi
